[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ecct"
version = "0.1.0"
description = "Reproducible research data pipeline, schema contracts, and benchmark toolkit for the SGCC Electricity Theft Detection dataset"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "walleyjs", email = "walley@users.noreply.github.com" }
]
keywords = [
    "electricity-theft-detection",
    "smart-grid",
    "time-series",
    "anomaly-detection",
    "sgcc",
    "machine-learning",
    "reproducible-research",
    "ecct"
]
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pandera>=0.20.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "scipy>=1.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/walleyjs/ecct"
Repository = "https://github.com/walleyjs/ecct"
Issues = "https://github.com/walleyjs/ecct/issues"

[project.scripts]
sgcc-theft = "src.cli:main"
ecct = "src.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v --strict-markers"
